<title>Authentication Debug Report</title>

<style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-raised: #f5f5f5;
    --text-primary: #1a1a1a;
    --text-secondary: #666666;
    --text-muted: #999999;
    --accent: #ff6b35;
    --accent-dim: #ff9770;
    --success: #10b981;
    --warning: #f59e0b;
    --border: #e5e5e5;
    --code-bg: #f8f8f8;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0a0a0a;
      --surface: #171717;
      --surface-raised: #262626;
      --text-primary: #f5f5f5;
      --text-secondary: #a3a3a3;
      --text-muted: #737373;
      --accent: #ff8c5a;
      --accent-dim: #ff6b35;
      --success: #34d399;
      --warning: #fbbf24;
      --border: #404040;
      --code-bg: #262626;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0a0a0a;
    --surface: #171717;
    --surface-raised: #262626;
    --text-primary: #f5f5f5;
    --text-secondary: #a3a3a3;
    --text-muted: #737373;
    --accent: #ff8c5a;
    --accent-dim: #ff6b35;
    --success: #34d399;
    --warning: #fbbf24;
    --border: #404040;
    --code-bg: #262626;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding: 48px 24px;
  }

  .container {
    max-width: 920px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 48px;
    padding-bottom: 24px;
    border-bottom: 2px solid var(--accent);
  }

  h1 {
    font-size: 32px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 8px;
    letter-spacing: -0.02em;
  }

  .subtitle {
    color: var(--text-secondary);
    font-size: 16px;
  }

  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 32px;
    margin-bottom: 24px;
  }

  h2 {
    font-size: 20px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  h3 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
    margin: 24px 0 12px;
  }

  .icon {
    width: 20px;
    height: 20px;
    display: inline-block;
  }

  .issue-list {
    list-style: none;
    margin: 16px 0;
  }

  .issue-item {
    padding: 12px 16px;
    background: var(--surface-raised);
    border-left: 3px solid var(--warning);
    margin-bottom: 12px;
    border-radius: 4px;
  }

  .fix-item {
    padding: 12px 16px;
    background: var(--surface-raised);
    border-left: 3px solid var(--success);
    margin-bottom: 12px;
    border-radius: 4px;
  }

  .fix-item strong {
    color: var(--accent);
    display: block;
    margin-bottom: 4px;
  }

  code {
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 3px;
    font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Courier New', monospace;
    font-size: 13px;
    color: var(--accent);
  }

  pre {
    background: var(--code-bg);
    padding: 16px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 12px 0;
    border: 1px solid var(--border);
  }

  pre code {
    background: none;
    padding: 0;
    color: var(--text-primary);
  }

  .badge {
    display: inline-block;
    padding: 4px 10px;
    background: var(--accent-dim);
    color: white;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .test-section {
    background: var(--surface-raised);
    padding: 20px;
    border-radius: 6px;
    margin-top: 16px;
  }

  .test-step {
    display: flex;
    gap: 12px;
    margin-bottom: 12px;
    align-items: start;
  }

  .step-number {
    background: var(--accent);
    color: white;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 600;
    flex-shrink: 0;
  }

  .step-content {
    flex: 1;
  }

  p {
    margin: 12px 0;
    color: var(--text-secondary);
  }

  .file-path {
    background: var(--code-bg);
    padding: 8px 12px;
    border-radius: 4px;
    font-family: 'SF Mono', Monaco, monospace;
    font-size: 13px;
    margin: 8px 0;
    display: inline-block;
    color: var(--text-muted);
  }

  a {
    color: var(--accent);
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
  }
