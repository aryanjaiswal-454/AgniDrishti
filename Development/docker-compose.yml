version: "3.8"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: agnidrishti-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agnidrishti}
      POSTGRES_USER: ${POSTGRES_USER:-agnidrishti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agnidrishti_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agnidrishti} -d ${POSTGRES_DB:-agnidrishti}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agnidrishti-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
